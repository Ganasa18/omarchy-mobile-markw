<!doctype html>

<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SSH Wi-Fi</title><link rel="stylesheet" href="mockup.css"></head>
<body><div class="phone">
  <div class="statusbar"><span>01:42</span><span>68%</span></div>
  <header><h1>ssh wi-fi</h1><span class="muted">aktif</span></header>
  <section>
    <div class="item"><span>Izinkan di Wi-Fi</span><span class="toggle on"></span></div>
    <div class="item"><span>Mati otomatis</span><span class="v">30 mnt (sisa 27)</span></div>
    <div class="item"><span>Alamat</span><span class="v">192.0.2.17</span></div>
  </section>
  <section>
    <h2>salin perintah</h2>
    <div class="copy">ssh user@192.0.2.17</div>
    <div class="copy">ssh root@192.0.2.17</div>
  </section>
  <section>
    <h2>sesi</h2>
    <div class="item"><span>192.0.2.40 · 01:15</span><span class="v">putus</span></div>
  </section>
  <section>
    <p class="small">Hanya kunci SSH. HP tetap bangun selama ada sesi; tanpa sesi HP tidur dan tidak bisa dijangkau sampai layar menyala.</p>
  </section>
  <div style="flex:1"></div>
  <div class="foot"><div></div></div>
</div></body></html>
