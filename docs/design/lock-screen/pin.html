<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rancangan buka kunci PIN</title><link rel="stylesheet" href="mockup.css"></head>
<body><main class="phone pin" aria-label="Mockup PIN statis, tidak memproses input">
  <svg class="landscape" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="stroke:none"><rect width="390" height="844" fill="#172232"/><circle cx="294" cy="288" r="60" fill="#afbed3" opacity=".65"/><path d="M-70 590Q80 250 255 430T490 470V844H-70Z" fill="#344961"/><path d="M-70 720Q120 390 304 531T480 550V844H-70Z" fill="#273b52"/><path d="M-90 820Q158 470 338 650T480 700V900H-90Z" fill="#1c2b3e"/></svg><div class="shade"></div>
  <header class="status"><span>09:41</span><span class="signals">84%</span></header>
  <section class="pin-heading"><svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><h1>Masukkan PIN</h1><p>Untuk membuka ponsel</p><div class="dots" aria-label="Contoh dua dari enam digit terisi"><span class="filled"></span><span class="filled"></span><span></span><span></span><span></span><span></span></div></section>
  <section class="keypad" aria-label="Contoh papan angka">
    <button class="key">1<small>&nbsp;</small></button><button class="key">2<small>ABC</small></button><button class="key">3<small>DEF</small></button>
    <button class="key">4<small>GHI</small></button><button class="key">5<small>JKL</small></button><button class="key">6<small>MNO</small></button>
    <button class="key">7<small>PQRS</small></button><button class="key">8<small>TUV</small></button><button class="key">9<small>WXYZ</small></button>
    <span></span><button class="key">0</button><button class="key utility" aria-label="Hapus digit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-6 7 6 7h13V5ZM11 9l6 6M17 9l-6 6"/></svg></button>
  </section><div class="pin-footer"><button class="cancel">Batal</button></div><div class="home-indicator"></div>
</main></body></html>
