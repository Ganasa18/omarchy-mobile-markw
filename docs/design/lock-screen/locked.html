<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rancangan layar kunci</title><link rel="stylesheet" href="mockup.css"></head>
<body><main class="phone" aria-label="Contoh layar kunci dengan data ilustrasi">

    <circle cx="294" cy="288" r="60" fill="#afbed3" opacity=".65"/>
