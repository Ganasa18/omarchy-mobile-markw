# SPDX-License-Identifier: MIT
# Device descriptor: Xiaomi Redmi 4 Prime (markw), MSM8953.
#
# RAM-loaded boot through a temporary lk2nd stage (fastboot boot, never
# flashed). The generic image, flash, push and installer paths refuse this
# descriptor. The eMMC is never writable; the Arch root lives on the
# microSD card (tools/build-markw-sd), and tools/build-markw-probe builds
# the boot image. Persistent installation is deferred (ENGINEERING-PLAN M9).

# --- Identity ---
CODENAME=markw
NAME="Xiaomi Redmi 4 Prime"
SOC=msm8953
# What the home screen's "This phone" card shows for the chip and the boot path.
SOC_NAME="Snapdragon 625"
BOOT_LABEL="microSD · lk2nd"
COMPATIBLE="xiaomi,markw"
# Storage guard continuation and USB networking. No radio, charger, camera
# or GPU firmware.
PACKAGE=omamobile-device-markw

# --- Kernel and device tree ---
DTB=qcom/msm8953-xiaomi-markw.dtb

# --- Boot and storage guard ---
BOOT_METHOD=ram-only
BOOT_IMAGES=""
UFS_RW=""

# --- Display ---
PANEL_SIZE=1080x1920
# Hyprland output scale: 1080x1920 at 2 is 540x960 logical. 2.25 would give
# Pixel's 480 px width but not a whole number of logical rows.
MONITOR_SCALE=2

# --- Power ---
# Idle timeouts in seconds, seeded once into the user's shell.json (0 turns
# one off): no screensaver animation, lock after a minute, then the lock
# blanks the panel. The screensaver kept the panel and GPU busy for minutes.
IDLE_SCREENSAVER=0
IDLE_LOCK=60
# Hyprland animations off (seeded once into looknfeel.lua): each redraws
# the screen for its whole length.
LOW_MOTION=1
# Suspend to idle after this many seconds with the screen off (0: never);
# read by omamobile-autosuspend, which ships disabled until it is proven.
AUTO_SUSPEND_DELAY=10
