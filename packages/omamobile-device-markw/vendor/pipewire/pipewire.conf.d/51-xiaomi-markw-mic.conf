# SPDX-License-Identifier: MIT
# The built-in microphone (AMIC1, left channel of the card's capture) picks
# up a steady tone near 12.7 kHz and sounds muffled: speech sits mostly
# below 1 kHz (BRINGUP-AUDIO.md, 2026-11-02). This source filters it for
# every application: a notch on the tone, a low-pass above the voice band,
# a presence lift at 2 kHz, and 6 dB of make-up gain. The raw card source
# stays available for tests.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Built-in Microphone"
      media.name = "Built-in Microphone"
      filter.graph = {
        nodes = [
          { type = builtin name = notch label = bq_notch
            control = { "Freq" = 12720.0 "Q" = 8.0 } }
          { type = builtin name = lowpass label = bq_lowpass
            control = { "Freq" = 8000.0 "Q" = 0.707 } }
          { type = builtin name = presence label = bq_peaking
            control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 6.0 } }
          { type = builtin name = gain label = linear
            control = { "Mult" = 2.0 "Add" = 0.0 } }
        ]
        links = [
          { output = "notch:Out" input = "lowpass:In" }
          { output = "lowpass:Out" input = "presence:In" }
          { output = "presence:Out" input = "gain:In" }
        ]
      }
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name = "capture.xiaomi-markw-mic"
        node.passive = true
        target.object = "alsa_input.platform-c051000.sound-card.HiFi__Mic__source"
        # Only the left channel carries the microphone; mixing in the
        # silent right one would halve the level.
        audio.position = [ FL ]
        stream.dont-remix = true
      }
      playback.props = {
        node.name = "xiaomi-markw-mic"
        media.class = Audio/Source
        audio.position = [ MONO ]
        # Above the card's own source (1728), so it is the default.
        priority.session = 2000
      }
    }
  }
]
