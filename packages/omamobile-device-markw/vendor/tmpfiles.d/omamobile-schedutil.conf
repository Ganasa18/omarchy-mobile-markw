# Omarchy Mobile on markw: schedutil may change the CPU clock at most every
# 20 ms. cpufreq-dt reports a 1 ms transition latency, so schedutil's 1.5 ms
# default let it switch about 90 times a second at idle and woke its sugov
# thread about 435 times a second; at 20 ms, 5 and 15 (2026-11-01). Idle
# sits at the lowest clock either way.
w /sys/devices/system/cpu/cpufreq/schedutil/rate_limit_us - - - - 20000
