# SPDX-License-Identifier: MIT
# Omarchy Mobile on markw: ModemManager at boot, so the quick settings
# tile can turn mobile data on, after the modem has booted idle on RAM
# copies of its NV. ModemManager connects nothing by itself; NetworkManager's
# gsm profile does, and its autoconnect follows the tile.
[Unit]
After=omamobile-markw-modem.service

# The modem stays up across s2idle. By default ModemManager drops every
# modem when logind announces a resume and probes them again, and it never
# finds this one again (QRTR announces its services once): after the first
# `systemctl suspend` there was no modem until a reboot. Quick
# suspend/resume keeps the modem and only syncs its state after the
# resume (device/markw/BRINGUP-SUSPEND.md, 2026-11-16).
[Service]
ExecStart=
ExecStart=/usr/bin/ModemManager --test-quick-suspend-resume
