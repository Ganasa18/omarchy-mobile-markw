# Omarchy Mobile on markw: ModemManager at boot, so the quick settings
# tile can turn mobile data on, after the modem has booted idle on RAM
# copies of its NV. ModemManager connects nothing by itself; NetworkManager's
# gsm profile does, and its autoconnect follows the tile.
[Unit]
After=omamobile-markw-modem.service
