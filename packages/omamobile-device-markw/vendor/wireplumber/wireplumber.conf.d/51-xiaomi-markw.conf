# SPDX-License-Identifier: MIT
# The xiaomi-markw card's MultiMedia front ends play and record S16_LE only
# in practice: PipeWire picked S24_LE, the PCM ran and the DSP took the data,
# and the loudspeaker stayed silent. S16_LE plays (BRINGUP-AUDIO.md,
# 2026-11-01).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-c051000.sound-card.*" }
      { node.name = "~alsa_input.platform-c051000.sound-card.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
