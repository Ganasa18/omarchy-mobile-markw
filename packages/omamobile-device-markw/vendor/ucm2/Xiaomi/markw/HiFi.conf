# SPDX-License-Identifier: MIT
# Redmi 4 Prime: PM8953 codec (msm8916-wcd) behind the LPASS ADSP. The
# loudspeaker's AW8738 hangs off the codec's line output (RX3), found by ear
# on 2026-10-29 (device/markw/BRINGUP-AUDIO.md step 5). The hardware gains
# stay fixed below 0 dB (84): the AW8738 has no speaker protection, so
# PipeWire's volume is software only.

SectionVerb {
	EnableSequence [
		# MultiMedia1 (PCM 0) plays on Primary MI2S; Tertiary MI2S records
		# into MultiMedia2 (PCM 1). Set before PipeWire opens the PCMs: a
		# front end with no back end fails at prepare.
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='MultiMedia2 Mixer TERT_MI2S_TX' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='RX3 MIX1 INP1' RX1"
		cset "name='RX3 Digital Volume' 70"
		cset "name='LINEOUT' Switch"
		cset "name='LINEOUT Ext' Switch"
	]

	DisableSequence [
		cset "name='LINEOUT Ext' ZERO"
		cset "name='LINEOUT' ZERO"
		cset "name='RX3 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='RX1 Digital Volume' 70"
		cset "name='RX2 Digital Volume' 70"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
	]

	DisableSequence [
		cset "name='HPHR' ZERO"
		cset "name='HPHL' ZERO"
		cset "name='RDAC2 MUX' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='DEC1 MUX' ADC1"
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC1 Volume' 8"
	]

	DisableSequence [
		cset "name='ADC1 Volume' 0"
		cset "name='DEC1 MUX' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='DEC1 MUX' ADC2"
		cset "name='CIC1 MUX' AMIC"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Volume' 8"
	]

	DisableSequence [
		cset "name='ADC2 Volume' 0"
		cset "name='ADC2 MUX' ZERO"
		cset "name='DEC1 MUX' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Mic Jack"
	}
}
