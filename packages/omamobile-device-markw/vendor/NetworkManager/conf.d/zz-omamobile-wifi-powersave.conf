# Omarchy Mobile on markw: Wi-Fi power save on (3 = enable), so the WCNSS
# radio dozes between beacons. Omarchy's
# /etc/NetworkManager/conf.d/omarchy-wifi-powersave.conf turns it off for
# laptops (latency spikes, Intel BE200 firmware). NetworkManager reads /etc
# after /usr/lib and each directory by name, so this file sits in /etc and
# sorts after Omarchy's. Measured on 2026-11-01: SSH and pacman still work,
# ping about 50 ms on average.
[connection]
wifi.powersave=3
