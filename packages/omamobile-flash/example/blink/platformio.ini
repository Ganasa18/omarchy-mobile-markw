; The example Flash copies to ~/proyek/blink: an ESP32 DevKit with the
; Arduino framework. Change board for another ESP32 (esp32-s3-devkitc-1,
; esp32-c3-devkitm-1, ...).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
